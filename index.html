<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAX Security — Web</title>
<style>
:root{color-scheme:dark;--bg:#070b10;--side:#0b1118;--card:#101821;--card2:#0d151d;--border:#1d2b38;--green:#27e58a;--blue:#4ca7ff;--cyan:#55d7ff;--warn:#ffc15a;--danger:#ff5f70;--purple:#a98cff;--text:#f5f8fb;--muted:#8998a7;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 75% 0,#0c1b2b 0,transparent 34%),var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.05px}button{font:inherit;color:inherit;border:0;cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:260px;background:rgba(9,15,22,.96);border-right:1px solid var(--border);padding:20px 14px;position:fixed;inset:0 auto 0 0;box-shadow:15px 0 45px rgba(0,0,0,.18);z-index:5}.brand{padding:7px 11px 20px}.brand h1{font-size:19px;margin:0 0 6px;letter-spacing:1px}.brand p{color:var(--muted);font-size:11px;margin:0}.tier{border:1px solid #23415b;border-radius:14px;padding:13px;margin:0 3px 20px;background:linear-gradient(145deg,#0f2233,#0c151e)}.tier b{display:block;font-size:12px}.tier span{color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.8px}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;padding:11px 13px;border-radius:10px;color:#aebac5;transition:.18s}.nav button:hover{background:#13202b;color:#fff;transform:translateX(2px)}.nav button.active{background:linear-gradient(90deg,#14324a,#10202e);color:#fff;box-shadow:inset 3px 0 var(--blue)}.main{margin-left:260px;width:calc(100% - 260px);padding:34px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.top h2{margin:0;font-size:30px;letter-spacing:-.5px}.pill{padding:7px 11px;border:1px solid #294154;border-radius:999px;color:#91a4b5;background:#0d1720}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:linear-gradient(145deg,rgba(18,28,38,.98),rgba(12,20,28,.98));border:1px solid var(--border);border-radius:17px;padding:21px;box-shadow:var(--shadow)}.card:hover{border-color:#2a4255}.hero{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:155px;background:radial-gradient(circle at 15% 50%,rgba(39,229,138,.08),transparent 35%),linear-gradient(145deg,#101f2b,#0c151e)}.status{display:flex;gap:16px;align-items:center}.shield{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#123d2c,#10261e);border:1px solid #235f45;display:grid;place-items:center;font-size:30px;box-shadow:0 0 35px rgba(39,229,138,.12)}.green{color:var(--green)}.muted{color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary{padding:11px 17px;border-radius:10px;font-weight:700}.primary{background:linear-gradient(135deg,#2be58d,#18bd70);color:#04120b;box-shadow:0 8px 25px rgba(39,229,138,.16)}.secondary{background:#17232e;border:1px solid #293d4d}.primary:hover,.secondary:hover{filter:brightness(1.08);transform:translateY(-1px)}.danger{color:var(--danger)}.warn{color:var(--warn)}.metric{font-size:29px;margin:7px 0}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #1b2935}.row:last-child{border:0}.section-title{margin:0 0 6px}.hidden{display:none}.feature{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid #1b2935}.feature:last-child{border:0}.badge{font-size:10px;padding:6px 9px;border-radius:999px;background:#102c20;color:var(--green);border:1px solid #1f6245;height:max-content;white-space:nowrap;font-weight:800;letter-spacing:.5px}.soon{background:#302516;color:var(--warn);border-color:#5c461f}.locked{background:#241f35;color:var(--purple);border-color:#493d6c}.drop{border:1px dashed #385064;border-radius:13px;padding:32px;text-align:center;margin-top:15px;background:#0c151d}.file-list{max-height:280px;overflow:auto;margin-top:14px}.file{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #1b2935;gap:10px}.progress{height:9px;background:#182530;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan));transition:.2s}.notice{padding:13px;border-radius:11px;background:#0d1720;border:1px solid #1c2c39;color:var(--muted);margin-top:12px;line-height:1.55}.switch{width:46px;height:25px;background:#24313c;border-radius:99px;padding:3px}.switch i{display:block;width:19px;height:19px;background:#87929d;border-radius:50%;transition:.18s}.switch.on{background:#197b50}.switch.on i{margin-left:21px;background:white}.plan-card{position:relative;overflow:hidden}.plan-icon{width:54px;height:54px;border-radius:16px;background:#102c45;border:1px solid #2d5f8c;display:grid;place-items:center;font-size:27px;margin-bottom:13px;color:var(--blue)}.plan-icon.gold{background:linear-gradient(135deg,#3a2a08,#17140d);border-color:#b88b25;color:#f2c75c;font-size:34px}.gold-badge{background:#3a2a08;color:#f2c75c;border-color:#8f6a1c}.gold-text{color:#f2c75c}@media(max-width:850px){.sidebar{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:20px}.nav{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.hero{display:block}.actions{margin-top:18px}}@media(max-width:520px){.nav{grid-template-columns:repeat(2,1fr)}.main{padding:14px}.top h2{font-size:24px}}
:root{color-scheme:dark;--bg:#070b10;--side:#0b1118;--card:#101821;--card2:#0d151d;--border:#1d2b38;--green:#27e58a;--blue:#4ca7ff;--cyan:#55d7ff;--warn:#ffc15a;--danger:#ff5f70;--purple:#a98cff;--text:#f5f8fb;--muted:#8998a7;--shadow:0 18px 50px rgba(0,0,0,.28)}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><h1>🛡 MAX SECURITY</h1><p>Powered by TriconX Technology</p></div><div class="tier"><b>Max Antivirus Premium</b><span>CORE PROTECTION</span></div><nav class="nav" id="nav"></nav></aside><main class="main"><div id="content"></div></main></div><script async src="https://js.stripe.com/v3/buy-button.js"></script>
<input id="files" type="file" multiple class="hidden">
<script>
const pages={overview:'Overview',active:'Active Protection',scan:'Scan',protection:'Protection',security:'Security & Privacy',web:'Web Guard',download:'Download Guard',quarantine:'Quarantine',ai:'AI Scanning',cloud:'Cloud Backup',reports:'Reports',health:'PC Health',plans:'Plans & Pricing',settings:'Settings',about:'About MAX'};
let state={page:'overview',files:[],threats:[],scanned:0,lastScan:null,subscription:{active:false,plan:'Max Premium',email:''},settings:{startup:false,tray:true,notifications:true,diagnostics:false,removable:true,archives:false,boot:false,compressed:false},antivirus:true,firewall:true};
const nav=document.getElementById('nav'), content=document.getElementById('content');
Object.entries(pages).forEach(([id,label])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>show(id);b.dataset.id=id;nav.appendChild(b)});
function shell(title,sub,body){content.innerHTML=`<div class="top"><div><h2>${title}</h2><div class="muted">${sub}</div></div><span class="pill">v1.0 Web</span></div>${body}`;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===state.page))}
function show(id){state.page=id; if(id==='overview')return overview(); if(id==='active')return activeProtection(); if(id==='scan')return scan(); if(id==='protection')return protection(); if(id==='web')return webGuard(); if(id==='download')return downloadGuard(); if(id==='quarantine')return quarantine(); if(id==='ai')return ai(); if(id==='cloud')return cloud(); if(id==='reports')return reports(); if(id==='health')return health(); if(id==='plans')return plans(); if(id==='settings')return settings(); if(id==='about')return about(); if(id==='security')return security(); coming(pages[id]);}
function activeProtection(){if(!state.subscription.active){shell('Active Protection','Premium protection dashboard',`<div class="card hero"><div class="status"><div class="shield">🔒</div><div><div class="warn" style="font-weight:900">PREMIUM PROTECTION LOCKED</div><h2 style="margin:6px 0">Activate MAX Premium</h2><div class="muted">Subscribe to unlock the active protection dashboard and premium security controls.</div></div></div><div class="actions"><a class="primary" href="https://buy.stripe.com/test_dRmbJ105W2sDbUZ9De1kA00" target="_blank" rel="noopener" style="text-decoration:none">GET PREMIUM</a><button class="secondary" onclick="activatePremium()">I HAVE A SUBSCRIPTION</button></div></div><div class="grid"><div class="card"><h3>Premium modules</h3><div class="feature"><div><b>Real-time Protection</b><div class="muted">Continuous Windows monitoring</div></div><span class="badge locked">PREMIUM</span></div><div class="feature"><div><b>Web & Download Guard</b><div class="muted">Block risky websites and downloads</div></div><span class="badge locked">PREMIUM</span></div><div class="feature"><div><b>Ransomware Protection</b><div class="muted">Monitor suspicious file behavior</div></div><span class="badge locked">PREMIUM</span></div></div><div class="card"><h3>Subscription</h3><div class="row"><span>Status</span><b class="warn">NOT ACTIVE</b></div><div class="row"><span>Plan</span><b>Max Premium</b></div><div class="notice">Subscription activation in this web demo is not payment verification. A production release should verify the Stripe subscription on a secure server before unlocking protection.</div></div></div>`);return}shell('Active Protection','Premium security dashboard',`<div class="grid"><div class="card hero"><div class="status"><div class="shield">🛡</div><div><div class="green" style="font-weight:900;letter-spacing:.6px">MAX PROTECTION ACTIVE</div><h2 style="margin:6px 0">Your PC is protected</h2><div class="muted">${state.subscription.plan} subscription active${state.subscription.email?' · '+escape(state.subscription.email):''}</div></div></div><div class="actions"><button class="primary" onclick="show('scan')">RUN QUICK SCAN</button><button class="secondary" onclick="show('reports')">VIEW REPORTS</button></div></div><div class="card"><h3 class="section-title">Protection dashboard</h3><div class="row"><span>Real-time Protection</span><b class="green">ACTIVE</b></div><div class="row"><span>Anti-spyware</span><b class="green">ACTIVE</b></div><div class="row"><span>Web Guard</span><b class="green">ACTIVE</b></div><div class="row"><span>Download Guard</span><b class="green">ACTIVE</b></div><div class="row"><span>Ransomware Protection</span><b class="green">ACTIVE</b></div><div class="row"><span>Network Protection</span><b class="green">ACTIVE</b></div></div><div class="card"><h3 class="section-title">Protection health</h3><div class="metric">100%</div><div class="muted">Protection modules enabled</div><div class="row"><span>Last scan</span><b>${state.lastScan||'Not run yet'}</b></div><div class="row"><span>Threats detected</span><b class="${state.threats.length?'danger':'green'}">${state.threats.length}</b></div><div class="row"><span>Files scanned</span><b>${state.scanned}</b></div></div><div class="card"><h3 class="section-title">Premium controls</h3><div class="actions"><button class="secondary" onclick="show('security')">SECURITY CONTROLS</button><button class="secondary" onclick="show('web')">WEB GUARD</button><button class="secondary" onclick="show('download')">DOWNLOAD GUARD</button><button class="secondary" onclick="show('quarantine')">QUARANTINE</button></div><div class="notice">Real Windows-wide protection still requires the native MAX Security desktop agent. This dashboard represents the subscribed product state.</div></div></div>`)}
function activatePremium(){let email=prompt('Enter the email used for your MAX Premium subscription:');if(!email)return;state.subscription.active=true;state.subscription.email=email;localStorage.setItem('maxSubscription',JSON.stringify(state.subscription));show('active')}
try{let saved=JSON.parse(localStorage.getItem('maxSubscription')||'null');if(saved&&saved.active)state.subscription=saved}catch(e){}
function overview(){shell('Overview','Your MAX Security web dashboard',`<div class="grid"><div class="card hero"><div class="status"><div class="shield">🛡</div><div><div class="green" style="font-weight:800">PROTECTED</div><div class="muted">Browser security checks are active. Windows-wide monitoring requires the desktop agent.</div></div></div><div class="actions"><button class="primary" onclick="show('scan')">QUICK SCAN</button><button class="secondary" onclick="show('protection')">PROTECTION CENTER</button></div></div><div class="card"><h3 class="section-title">Protection status</h3><div class="row"><span>On-demand file scanning</span><button class="switch on" onclick="show('scan')"><i></i></button></div><div class="row"><span>Real-time Protection</span><b class="warn">DESKTOP ONLY</b></div><div class="row"><span>Web Guard</span><button class="badge" onclick="show('web')">ACTIVE</button></div><div class="row"><span>Download Guard</span><button class="badge" onclick="show('download')">ACTIVE</button></div><div class="row"><span>Ransomware Protection</span><button class="badge" onclick="ransomwareInfo()">ACTIVE</button></div></div><div class="card"><h3 class="section-title">Activity</h3><div class="row"><span>Last scan</span><b>${state.lastScan||'Never'}</b></div><div class="row"><span>Threats detected</span><b>${state.threats.length}</b></div><div class="row"><span>Files scanned</span><b>${state.scanned}</b></div></div></div>`)}
function ai(){shell('AI Scanning','Analyze scan results and prioritize review','<div class="grid"><div class="card"><h3 class="section-title">AI Security Analysis</h3><p class="muted">Explain the latest scan using MAX security rules and prioritize suspicious results.</p><button class="primary" onclick="runAI()">ANALYZE RESULTS</button><div class="notice">'+(state.ai||'No analysis yet.')+'</div></div><div class="card"><div class="row"><span>Files inspected</span><b>'+state.scanned+'</b></div><div class="row"><span>Detections</span><b class="'+(state.threats.length?'danger':'green')+'">'+state.threats.length+'</b></div></div></div>')}
function runAI(){state.ai=state.threats.length?'High-priority review: a test signature was detected. Quarantine the detected item.':'No test-signature detections. This does not prove a file is safe.';ai()}
function cloud(){shell('Cloud Backup','Protect MAX security data','<div class="card"><div class="actions"><button class="primary" onclick="backupState()">BACK UP DATA</button><button class="secondary" onclick="restoreState()">RESTORE</button></div><div class="row"><span>Backup items</span><b>'+((state.cloud&&state.cloud.length)||0)+'</b></div><div class="notice">Demo backup stores metadata locally. A production version needs authenticated cloud storage.</div></div>')}
function backupState(){state.cloud=['Scan history','Quarantine list','MAX settings'];cloud()}
function restoreState(){alert('Demo restore completed. Connect an authenticated cloud backend before production use.')}
function security(){shell('Security & Privacy','Core MAX protection controls',`<div class="grid"><div class="card"><h3 class="section-title">Antivirus & Anti-Spyware</h3><div class="row"><span>On-demand antivirus</span><button class="switch ${state.antivirus?'on':''}" onclick="state.antivirus=!state.antivirus;security()"><i></i></button></div><div class="row"><span>Anti-spyware detection</span><button class="switch ${state.antivirus?'on':''}" onclick="state.antivirus=!state.antivirus;security()"><i></i></button></div><div class="notice">Browser build supports selected-file scanning. Continuous real-time protection requires the Windows agent.</div></div><div class="card"><h3 class="section-title">Firewall & Network Security</h3><div class="row"><span>MAX network protection</span><button class="switch ${state.firewall?'on':''}" onclick="state.firewall=!state.firewall;security()"><i></i></button></div><div class="row"><span>Network threat monitoring</span><b class="warn">DESKTOP AGENT</b></div><div class="notice">A browser cannot control the Windows firewall. The native MAX agent can integrate with Windows network security.</div></div><div class="card"><h3 class="section-title">Web Security & Parental Control</h3><div class="row"><span>Safe browsing</span><b class="green">ACTIVE</b></div><div class="row"><span>Website filtering</span><b class="warn">EXTENSION</b></div><div class="row"><span>Parental controls</span><b class="warn">DESKTOP / ACCOUNT</b></div></div><div class="card"><h3 class="section-title">Privacy & Data Protection</h3><div class="row"><span>Privacy monitoring</span><b class="green">ACTIVE</b></div><div class="row"><span>Protected data workflows</span><b class="green">ACTIVE</b></div><div class="notice">MAX Security does not include a VPN. Privacy protection here covers the MAX security controls shown above.</div></div></div>`)}
function reports(){shell('Security Reports','Review MAX protection activity','<div class="grid"><div class="card"><div class="metric">'+state.scanned+'</div><div class="muted">Files scanned</div><div class="row"><span>Threats detected</span><b class="'+(state.threats.length?'danger':'green')+'">'+state.threats.length+'</b></div><div class="row"><span>Quarantined</span><b>'+((state.quarantine&&state.quarantine.length)||0)+'</b></div><div class="row"><span>Last scan</span><b>'+(state.lastScan||'Never')+'</b></div></div><div class="card"><h3>Report log</h3><p class="muted">'+((state.lastScan)?'Latest scan recorded successfully.':'No scan report yet.')+'</p><button class="secondary" onclick="reports()">REFRESH</button></div></div>')}
function quarantineDetected(){state.quarantine=[...state.threats];quarantine()}
function quarantine(){shell('Quarantine','Review files detected during this session','<div class="card"><div class="actions"><button class="primary" onclick="quarantineDetected()">QUARANTINE DETECTED</button><button class="secondary" onclick="state.quarantine=[];quarantine()">CLEAR</button></div><div class="notice">The web build records detected files in session quarantine. Real Windows isolation requires the native desktop agent.</div><p class="muted">'+(state.quarantine.length+' item(s) quarantined.')+'</p></div>')}
function health(){shell('PC Health','Browser-accessible device health','<div class="grid"><div class="card"><div class="metric">'+(navigator.userAgentData?.platform||navigator.platform)+'</div><div class="row"><span>Online</span><b class="green">'+(navigator.onLine?'YES':'NO')+'</b></div><div class="row"><span>CPU cores</span><b>'+(navigator.hardwareConcurrency||'Unknown')+'</b></div><div class="row"><span>Memory estimate</span><b>'+(navigator.deviceMemory?(navigator.deviceMemory+' GB'):'Unavailable')+'</b></div></div><div class="card"><h3>Windows checks</h3><div class="row"><span>Defender</span><b class="muted">Desktop agent</b></div><div class="row"><span>Firewall</span><b class="muted">Desktop agent</b></div><div class="row"><span>Battery</span><b id="battery" class="muted">Checking…</b></div><div class="notice">The native MAX agent can query Windows security, battery, RAM and disk health.</div></div></div>');if(navigator.getBattery)navigator.getBattery().then(b=>document.getElementById('battery').textContent=Math.round(b.level*100)+'%');else document.getElementById('battery').textContent='Unavailable'}
function settings(){shell('Settings','Configure MAX Security preferences','<div class="card">'+[['startup','Start with Windows'],['tray','Minimize to system tray'],['notifications','Security notifications'],['diagnostics','Anonymous diagnostics'],['removable','Scan removable drives'],['archives','Scan archive files']].map(x=>'<div class="row"><span>'+x[1]+'</span><button class="switch '+(state.settings[x[0]]?'on':'')+'" onclick="toggle(\''+x[0]+'\',this)"><i></i></button></div>').join('')+'<button class="primary" style="margin-top:16px" onclick="alert(\'Settings saved for this web session.\')">SAVE SETTINGS</button><div class="notice">Windows-level settings require the native MAX desktop agent.</div></div>')}function toggle(k,b){state.settings[k]=!state.settings[k];b.classList.toggle('on',state.settings[k])}
function scan(){shell('Scan Center','Scan selected files or perform a full drive/folder scan',`<div class="card"><div class="actions"><button class="primary" onclick="pick()">CHOOSE FILES</button><button class="primary" onclick="fullPcScan()">FULL PC SCAN</button><button class="secondary" onclick="clearScan()">CLEAR</button></div><div class="drop"><b>🛡 MAX Total Security Scan</b><br><span class="muted">Full PC Scan recursively inspects files inside a folder or drive you explicitly choose. For a true unattended Windows-wide scan, the native MAX Security desktop agent is required.</span></div><div id="scanArea"></div></div>`);renderFiles()}
async function fullPcScan(){if(!window.showDirectoryPicker){alert('Full PC Scan needs a Chromium browser with File System Access support.');return}let root;try{root=await window.showDirectoryPicker({mode:'read'});}catch(e){return}state.files=[];state.threats=[];state.scanned=0;state.lastScan=null;let area=document.getElementById('scanArea');area.innerHTML='<div class="progress"><div id="bar" class="bar"></div></div><div class="muted" id="p">0 files scanned</div><div class="notice" id="scanStatus">Scanning selected folder recursively…</div>';let total=0;let scanned=0;async function countAndScan(dir){for await(const entry of dir.values()){try{if(entry.kind==='directory'){await countAndScan(entry)}else if(entry.kind==='file'){total++;let f=await entry.getFile();let buf=await f.arrayBuffer();let hash=await crypto.subtle.digest('SHA-256',buf);let text='';if(f.size<4096){try{text=new TextDecoder('ascii').decode(buf)}catch{}}if(text.includes('EICAR-STANDARD-ANTIVIRUS-TEST-FILE'))state.threats.push({name:f.name,reason:'Matches the EICAR standard antivirus test signature.',hash});scanned++;state.scanned++;document.getElementById('p').textContent=scanned+' file(s) scanned';document.getElementById('scanStatus').textContent='MAX is scanning files recursively… Threats detected: '+state.threats.length;}}catch(e){}}}await countAndScan(root);state.lastScan=new Date().toLocaleString();document.getElementById('scanStatus').innerHTML='<b>Full scan complete.</b> '+state.scanned+' file(s) inspected, <b class="'+(state.threats.length?'danger':'green')+'">'+state.threats.length+' threat(s)</b> detected.';document.getElementById('p').textContent=state.scanned+' file(s) scanned';document.getElementById('bar').style.width='100%'}
function pick(){document.getElementById('files').click()}document.getElementById('files').onchange=e=>{state.files=[...e.target.files];renderFiles()};
async function runScan(){state.threats=[];state.scanned=0;renderFiles(true);let area=document.getElementById('scanArea');for(let f of state.files){let buf=await f.arrayBuffer();let hash=await crypto.subtle.digest('SHA-256',buf);let hex=[...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();let text='';if(f.size<4096){try{text=new TextDecoder('ascii').decode(buf)}catch{}}let eicar=text.includes('EICAR-STANDARD-ANTIVIRUS-TEST-FILE');if(eicar)state.threats.push({name:f.name,reason:'Matches the EICAR standard antivirus test signature.',hash});state.scanned++;area.querySelector('#p').textContent=Math.round(state.scanned/state.files.length*100)+'%';area.querySelector('#bar').style.width=(state.scanned/state.files.length*100)+'%';}state.lastScan=new Date().toLocaleString();renderFiles(false);}
function renderFiles(running=false){let area=document.getElementById('scanArea');if(!area)return;area.innerHTML=state.files.length?`<div class="progress"><div id="bar" class="bar"></div></div><div class="muted" id="p">${running?'0%':'100%'}</div><div class="actions" style="margin:14px 0"><button class="primary" onclick="runScan()" ${running?'disabled':''}>${running?'SCANNING…':'SCAN SELECTED FILES'}</button></div><div class="file-list">${state.files.map(f=>`<div class="file"><span>${escape(f.name)}</span><span class="muted">${fmt(f.size)}</span></div>`).join('')}</div>${!running&&state.scanned?`<div class="notice">Scan complete: ${state.scanned} file(s) inspected, <b class="${state.threats.length?'danger':'green'}">${state.threats.length} threat(s)</b> detected.</div>`:''}`:'<div class="notice">No files selected.</div>'}
function clearScan(){state.files=[];state.threats=[];state.scanned=0;renderFiles()}
function protection(){shell('Protection Center','Protection controls and capability status',`<div class="card">${[['On-demand File Scanning','SHA-256 hashing and EICAR test detection.','ACTIVE','show(\'scan\')'],['Real-time Protection','Continuous Windows file monitoring requires a desktop agent/driver.','DESKTOP ONLY','desktopInfo()'],['Web Guard','URL reputation and browser interception require an extension/service.','COMING SOON','show(\'web\')'],['Download Guard','Download interception and file reputation require a browser extension/service.','COMING SOON','show(\'download\')'],['Ransomware Protection','Continuous file-behavior monitoring requires a desktop security component.','COMING SOON','ransomwareInfo()']].map(x=>`<div class="feature"><div><b>${x[0]}</b><div class="muted" style="margin-top:6px">${x[1]}</div></div><button class="badge ${x[2]!=='ACTIVE'?'soon':''}" onclick="${x[3]}">${x[2]}</button></div>`).join('')}</div>`)}
function desktopInfo(){alert('Real-time Protection requires the MAX Security Windows desktop agent. This web build cannot continuously monitor Windows files.')}
function ransomwareInfo(){alert('Ransomware Protection requires a privileged Windows security component for continuous file-behavior monitoring. It is not active in this browser build.')}
function quarantine(){shell('Quarantine','Web-safe session quarantine',`<div class="card"><div class="notice">A browser cannot move or delete arbitrary files from your Windows drive. Detected files are therefore recorded in this session only. The native desktop app can perform real quarantine actions.</div>${state.threats.length?state.threats.map(t=>`<div class="feature"><div><b>${escape(t.name)}</b><div class="muted">${escape(t.reason)}</div></div><span class="badge soon">DETECTED</span></div>`).join(''):'<p class="muted">No detected files in this session.</p>'}</div>`)}
function health(){shell('PC Health','Browser-accessible health information only',`<div class="grid"><div class="card"><div class="muted">Browser</div><div class="metric">${navigator.userAgentData?.platform||navigator.platform}</div><div class="row"><span>Online</span><b class="green">${navigator.onLine?'YES':'NO'}</b></div><div class="row"><span>CPU cores exposed</span><b>${navigator.hardwareConcurrency||'Unknown'}</b></div><div class="row"><span>Memory estimate</span><b>${navigator.deviceMemory?navigator.deviceMemory+' GB':'Unavailable'}</b></div></div><div class="card"><h3>Windows security</h3><div class="row"><span>Defender</span><b class="muted">Unknown</b></div><div class="row"><span>Firewall</span><b class="muted">Unknown</b></div><div class="row"><span>Battery</span><b id="battery" class="muted">Checking…</b></div><div class="notice">The original WPF app can query Windows Defender, firewall, battery, RAM and disk through Windows APIs. A normal web page cannot access those APIs.</div></div></div>`);if(navigator.getBattery)navigator.getBattery().then(b=>document.getElementById('battery').textContent=Math.round(b.level*100)+'%');else document.getElementById('battery').textContent='Unavailable'}
function settings(){shell('Settings','Configure MAX Security preferences and scan behavior',`<div class="grid"><div class="card"><h3 class="section-title">General Settings</h3>${[['startup','Start MAX Security with Windows'],['tray','Minimize to system tray'],['notifications','Security notifications'],['diagnostics','Send anonymous diagnostic data']].map(([k,t])=>`<div class="row"><span>${t}</span><button class="switch ${state.settings[k]?'on':''}" onclick="toggle('${k}',this)"><i></i></button></div>`).join('')}</div><div class="card"><h3 class="section-title">Scan Settings</h3><p class="muted">Adjust what manual or scheduled system scans should inspect.</p>${[['removable','Removable drives','Scan USB and other removable drives'],['boot','Boot sectors','Inspect boot-sector areas during system scans'],['compressed','Compressed archives','Inspect supported ZIP and other compressed archives']].map(([k,t,d])=>`<div class="row"><div><b>${t}</b><div class="muted" style="font-size:12px;margin-top:4px">${d}</div></div><button class="switch ${state.settings[k]?'on':''}" onclick="toggle('${k}',this)"><i></i></button></div>`).join('')}<div class="notice">These settings control the MAX scan policy. The web demo cannot schedule privileged Windows scans; the desktop agent will enforce them.</div></div><div class="card"><h3 class="section-title">Protection Modules</h3><div class="row"><span>Antivirus & Anti-Spyware</span><button class="badge" onclick="show('security')">CONFIGURE</button></div><div class="row"><span>Firewall & Network Security</span><button class="badge" onclick="show('security')">CONFIGURE</button></div><div class="row"><span>Web Security & Parental Control</span><button class="badge" onclick="show('security')">CONFIGURE</button></div><div class="row"><span>Privacy & Data Protection</span><button class="badge" onclick="show('security')">CONFIGURE</button></div></div></div>`)}function toggle(k,b){state.settings[k]=!state.settings[k];b.classList.toggle('on',state.settings[k])}

function fmt(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}function escape(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
